<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nusantara Avian — Katalog Ayam Hias</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="site-topbar"></div>

  <header class="hero">
    <span class="brand-tag">Katalog Resmi Koleksi Unggas</span>
    <h1>Nusantara Avian</h1>
    <p>Etalase ayam hias pilihan berkualitas kontes dan peliharaan eksotis dari berbagai ras lokal maupun mancanegara.</p>
  </header>

  <section class="catalog-meta">
    <h2>Daftar Koleksi Ayam Hias</h2>
    <span class="catalog-count" id="total-produk"></span>
  </section>

  <main class="catalog-main">
    <div class="catalog-grid" id="catalog-container"></div>
  </main>

  <footer>
    <p><strong>Nusantara Avian</strong> — Toko Online Ayam Hias</p>
    <p class="footer-note">Simulasi Pemesanan &amp; Pembayaran QRIS &bull; Jl. Raya Pertanian No. 45, Bogor</p>
  </footer>

  <script src="app.js"></script>
  <script>
    (function () {
      const store = window.NAStore;
      store.renderTopbar("katalog");

      const container = document.getElementById("catalog-container");
      const totalLabel = document.getElementById("total-produk");

      function getQtyInCart(productId) {
        const found = store.getCart().find(function (c) {
          return c.id === productId;
        });
        return found ? found.qty : 0;
      }

      function renderKatalog() {
        const produk = store.daftarAyamHias;
        totalLabel.textContent = "Menampilkan " + produk.length + " jenis ayam hias";

        container.innerHTML = produk.map(function (item) {
          const inCart = getQtyInCart(item.id);
          const btnText = inCart > 0
            ? "+ Tambah Lagi (" + inCart + " di keranjang)"
            : "+ Tambah ke Keranjang";

          return (
            '<article class="card">' +
            '  <div class="card-image">' +
            '    <span class="badge-origin">' + store.escapeHtml(item.asal) + '</span>' +
            '    <img src="' + store.escapeHtml(item.gambar) + '" alt="' + store.escapeHtml(item.nama) + '" loading="lazy">' +
            '  </div>' +
            '  <div class="card-body">' +
            '    <span class="card-category">' + store.escapeHtml(item.kategori) + '</span>' +
            '    <h3 class="card-title">' + store.escapeHtml(item.nama) + '</h3>' +
            '    <p class="card-desc">' + store.escapeHtml(item.deskripsi) + '</p>' +
            '    <div class="card-specs">' +
            '      <span class="spec-pill">' + store.escapeHtml(item.usia) + '</span>' +
            '      <span class="spec-pill">' + store.escapeHtml(item.status) + '</span>' +
            '    </div>' +
            '    <div class="card-footer">' +
            '      <span class="price">' + store.escapeHtml(item.harga) + '</span>' +
            '      <span class="unit">' + store.escapeHtml(item.satuan) + '</span>' +
            '    </div>' +
            '    <button type="button" class="btn btn-primary btn-block btn-add-cart" data-id="' + store.escapeHtml(item.id) + '">' +
            '      ' + btnText +
            '    </button>' +
            '  </div>' +
            '</article>'
          );
        }).join("");
      }

      container.addEventListener("click", function (e) {
        const btn = e.target.closest(".btn-add-cart");
        if (!btn) return;
        const id = btn.getAttribute("data-id");
        const item = store.daftarAyamHias.find(function (p) { return p.id === id; });
        if (!item) return;

        store.addToCart(id, 1);
        store.showToast(item.nama + " ditambahkan ke keranjang");
        renderKatalog();
      });

      store.onRealtimeUpdate(function () {
        renderKatalog();
      });

      renderKatalog();
    })();
  </script>
</body>
</html>
