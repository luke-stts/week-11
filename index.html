  <style>
    :root {
      --bg-page: #f7f5f0;
      --bg-card: #ffffff;
      --text-main: #2c2825;
      --text-muted: #6e675f;
      --accent: #3d5a45;
      --gold: #b08943;
      --border: #e4dfd5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.6;
    }

    header {
      background-color: var(--accent);
      color: #ffffff;
      padding: 2.5rem 1.5rem;
      text-align: center;
      border-bottom: 4px solid var(--gold);
    }

    .brand-tag {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #e6d5b8;
      margin-bottom: 0.5rem;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }

    header p {
      max-width: 620px;
      margin: 0 auto;
      font-size: 0.95rem;
      color: #dce5de;
    }

    .catalog-meta {
      max-width: 1180px;
      margin: 2rem auto 1.25rem;
      padding: 0 1.5rem 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .catalog-meta h2 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .catalog-count {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    main {
      max-width: 1180px;
      margin: 0 auto 4rem;
      padding: 0 1.5rem;
    }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card-image {
      height: 220px;
      background-color: #eceae4;
      position: relative;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .badge-origin {
      position: absolute;
      top: 12px;
      left: 12px;
      background-color: rgba(255, 255, 255, 0.92);
      color: var(--accent);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.25rem 0.6rem;
      border-radius: 4px;
      border: 1px solid var(--border);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-category {
      font-size: 0.75rem;
      color: var(--gold);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .card-title {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .card-desc {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      flex-grow: 1;
    }

    .card-specs {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .spec-pill {
      font-size: 0.75rem;
      background-color: var(--bg-page);
      color: var(--text-main);
      padding: 0.2rem 0.55rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .card-footer {
      padding-top: 0.85rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
    }

    .unit {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    footer {
      background-color: #24211e;
      color: #b8b2a8;
      text-align: center;
      padding: 2rem 1.5rem;
      font-size: 0.85rem;
    }

    footer strong {
      color: #ffffff;
    }

    .footer-note {
      margin-top: 0.4rem;
      font-size: 0.78rem;
      color: #8a8378;
    }
  </style>
</head>

    function renderKatalog() {
      const container = document.getElementById("catalog-container");
      const totalLabel = document.getElementById("total-produk");

      totalLabel.textContent = `Menampilkan ${daftarAyamHias.length} jenis ayam hias`;

      const htmlCards = daftarAyamHias.map((item) => `
        <article class="card">
          <div class="card-image">
            <span class="badge-origin">${item.asal}</span>
            <img src="${item.gambar}" alt="${item.nama}" loading="lazy">
          </div>
          <div class="card-body">
            <span class="card-category">${item.kategori}</span>
            <h3 class="card-title">${item.nama}</h3>
            <p class="card-desc">${item.deskripsi}</p>
            <div class="card-specs">
              <span class="spec-pill">${item.usia}</span>
              <span class="spec-pill">${item.status}</span>
            </div>
            <div class="card-footer">
              <span class="price">${item.harga}</span>
              <span class="unit">${item.satuan}</span>
            </div>
          </div>
        </article>
      `).join("");

      container.innerHTML = htmlCards;
    }

    renderKatalog();
